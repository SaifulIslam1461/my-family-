<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পারিবারিক ঐতিহ্য - Family Heritage</title>

    <!-- FontAwesome & Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { emerald: { 800: '#1b4332', 900: '#0d1f17' }, gold: '#D4AF37' },
                    fontFamily: { bangla: ['"Tiro Bangla"', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tiro Bangla', serif; }
        .tab-btn.active { border-bottom: 3px solid #D4AF37; color: #D4AF37; }
        .media-tab.active { background-color: #D4AF37; color: #0d1f17; font-weight: bold; }
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            width: 14px;
            height: 14px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-emerald-900 dark:text-gray-100 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-2 space-x-reverse">
            <i class="fa-solid fa-people-roof text-2xl text-yellow-400"></i>
            <h1 class="text-xl font-bold">পারিবারিক ঐতিহ্য v1.0</h1>
        </div>
        <span class="text-xs bg-emerald-700 text-yellow-300 px-3 py-1 rounded-full font-bold">পাবলিক মোড</span>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto p-4 space-y-6">

        <!-- Banner -->
        <div class="relative bg-emerald-800 rounded-2xl overflow-hidden shadow-lg text-white">
            <img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=800" class="w-full h-36 object-cover opacity-40" alt="Banner">
            <div class="absolute bottom-0 left-0 p-4 bg-gradient-to-t from-black/80 to-transparent w-full">
                <h2 id="tab-title" class="text-xl font-bold text-yellow-400">পারিবারিক আর্কাইভ</h2>
                <p id="tab-subtitle" class="text-xs italic">"ঈমান, একতা ও ঐতিহ্যের বন্ধন"</p>
            </div>
        </div>

        <!-- Post Creation Form -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-3">
            <div class="flex gap-2">
                <input type="text" id="author-name" placeholder="আপনার নাম (যেমন: সাইফুল)" class="w-1/2 bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-xs focus:outline-none dark:text-white border dark:border-gray-600">
                <select id="post-category" class="w-1/2 bg-gray-100 dark:bg-gray-700 p-2 rounded-lg text-xs focus:outline-none dark:text-white border dark:border-gray-600">
                    <option value="general">সাধারণ বার্তা</option>
                    <option value="archive">স্মৃতি/আর্কাইভ</option>
                    <option value="islamic">ইসলামিক দিকনির্দেশনা</option>
                </select>
            </div>
            
            <textarea id="post-text" placeholder="পরিবারের জন্য কোনো স্মৃতি বা বার্তা লিখুন..." class="w-full bg-gray-100 dark:bg-gray-700 p-3 rounded-lg text-sm focus:outline-none dark:text-white" rows="2"></textarea>
            
            <!-- Direct File Attachment Input -->
            <div class="space-y-2 border-t dark:border-gray-700 pt-3">
                <div class="flex items-center gap-2">
                    <label for="media-file" class="cursor-pointer bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-2 dark:text-white transition">
                        <i class="fa-solid fa-paperclip text-yellow-500"></i>
                        <span id="file-label">ছবি বা ভিডিও ফাইল যুক্ত করুন</span>
                    </label>
                    <input type="file" id="media-file" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)">
                </div>

                <div class="flex justify-between items-center gap-2">
                    <p id="upload-status" class="text-[11px] text-gray-400 italic"></p>
                    <button id="btn-create-post" onclick="createPost()" class="bg-emerald-800 hover:bg-emerald-700 text-white text-xs px-4 py-2 rounded-lg font-bold flex items-center gap-2">
                        <span id="post-spinner" class="spinner hidden"></span>
                        <span>পোস্ট করুন</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 🖼️ Separate Gallery Folder Tabs (ছবি ও ভিডিওর জন্য আলাদা ফাইল/জায়গা) -->
        <div class="bg-white dark:bg-gray-800 p-2 rounded-xl shadow-sm space-y-2">
            <p class="text-[11px] text-gray-400 text-center font-bold">ফাইল ভিউ ফিল্টার</p>
            <div class="flex justify-center gap-1 bg-gray-100 dark:bg-gray-700 p-1 rounded-lg">
                <button onclick="setMediaView('all')" id="view-all" class="media-tab active text-xs px-3 py-1.5 rounded-md transition flex-1 text-center">সব পোস্ট</button>
                <button onclick="setMediaView('photos')" id="view-photos" class="media-tab text-xs px-3 py-1.5 rounded-md transition flex-1 text-center flex items-center justify-center gap-1"><i class="fa-solid fa-images text-blue-400"></i> ছবি গ্যালারি</button>
                <button onclick="setMediaView('videos')" id="view-videos" class="media-tab text-xs px-3 py-1.5 rounded-md transition flex-1 text-center flex items-center justify-center gap-1"><i class="fa-solid fa-film text-red-400"></i> ভিডিও গ্যালারি</button>
            </div>
        </div>

        <!-- Feed Area -->
        <div id="posts-container" class="space-y-4">
            <p class="text-center text-sm text-gray-500">ডাটা লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Image Modal for Full Preview -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onclick="closeModal()">
        <img id="modal-img" src="" class="max-w-full max-h-[90vh] rounded-lg">
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full bg-white dark:bg-gray-800 border-t dark:border-gray-700 flex justify-around p-2 text-xs z-40">
        <button onclick="switchTab('feed')" id="tab-feed" class="tab-btn flex flex-col items-center active text-yellow-400"><i class="fa-solid fa-house text-lg"></i><span>হোম ফিড</span></button>
        <button onclick="switchTab('archive')" id="tab-archive" class="tab-btn flex flex-col items-center text-gray-400"><i class="fa-solid fa-box-archive text-lg"></i><span>আর্কাইভ</span></button>
        <button onclick="switchTab('islamic')" id="tab-islamic" class="tab-btn flex flex-col items-center text-gray-400"><i class="fa-solid fa-mosque text-lg"></i><span>ইসলামিক</span></button>
    </nav>

    <script>
        const SUPABASE_BASE = 'https://zwpoxufpeluqtdooeekr.supabase.co';
        const SUPABASE_URL = `${SUPABASE_BASE}/rest/v1/posts`;
        const STORAGE_URL = `${SUPABASE_BASE}/storage/v1/object/media`;
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3cG94dWZwZWx1cXRkb29lZWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjgyMzIsImV4cCI6MjEwNjg0NDIzMn0.oEwsRjnoXe5hNI7Iw4-UAOUMyA3mVc_ybZ48rHi4Uks';

        let currentTab = 'feed';
        let mediaView = 'all'; // 'all', 'photos', 'videos'
        let selectedFile = null;
        let cachedPosts = [];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-label').innerText = `ফাইল: ${file.name.substring(0, 15)}...`;
            }
        }

        async function fetchPosts() {
            const container = document.getElementById('posts-container');

            try {
                const response = await fetch(`${SUPABASE_URL}?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                cachedPosts = await response.json();
                renderPosts();
            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<p class="text-center text-sm text-red-500 bg-red-100 p-3 rounded-lg">পোস্ট লোড করতে সমস্যা হয়েছে: ${err.message}</p>`;
            }
        }

        async function createPost() {
            const author = document.getElementById('author-name').value.trim() || 'পারিবারিক সদস্য';
            const category = document.getElementById('post-category').value;
            const content = document.getElementById('post-text').value.trim();
            const statusLabel = document.getElementById('upload-status');
            
            if (!content && !selectedFile) return alert("পোস্ট করতে কিছু লিখুন বা ছবি/ভিডিও নির্বাচন করুন!");

            const spinner = document.getElementById('post-spinner');
            const btn = document.getElementById('btn-create-post');
            spinner.classList.remove('hidden');
            btn.disabled = true;

            let uploadedMediaUrl = null;

            if (selectedFile) {
                statusLabel.innerText = "ফাইল আপলোড হচ্ছে...";
                try {
                    const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '_')}`;
                    const uploadRes = await fetch(`${STORAGE_URL}/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': selectedFile.type
                        },
                        body: selectedFile
                    });

                    if (uploadRes.ok) {
                        uploadedMediaUrl = `${SUPABASE_BASE}/storage/v1/object/public/media/${fileName}`;
                    }
                } catch (e) {
                    console.error("Upload error:", e);
                }
            }

            statusLabel.innerText = "পোস্ট সাবমিট হচ্ছে...";
            const categoryLabel = category === 'islamic' ? ' [ইসলামিক]' : category === 'archive' ? ' [আর্কাইভ]' : '';

            const payload = {
                author_name: `${author}${categoryLabel}`,
                content: content || 'মিডিয়া ফাইল শেয়ার করেছেন',
                media_url: uploadedMediaUrl
            };

            try {
                const response = await fetch(SUPABASE_URL, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('post-text').value = '';
                    document.getElementById('media-file').value = '';
                    document.getElementById('file-label').innerText = 'ছবি বা ভিডিও ফাইল যুক্ত করুন';
                    selectedFile = null;
                    statusLabel.innerText = '';
                    fetchPosts();
                } else {
                    const errData = await response.json();
                    alert("পোস্ট সাবমিট করা যায়নি: " + (errData.message || response.statusText));
                }
            } catch (err) {
                alert("নেটওয়ার্ক সমস্যা: " + err.message);
            } finally {
                spinner.classList.add('hidden');
                btn.disabled = false;
                statusLabel.innerText = '';
            }
        }

        function isVideo(url) {
            if (!url) return false;
            const exts = ['.mp4', '.webm', '.ogg', '.mov', '.m4v', '.3gp', '.mkv'];
            return exts.some(ext => url.toLowerCase().includes(ext));
        }

        function setMediaView(view) {
            mediaView = view;
            document.querySelectorAll('.media-tab').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`view-${view}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderPosts();
        }

        function openModal(src) {
            document.getElementById('modal-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (!cachedPosts || cachedPosts.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-500 py-6">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি তৈরি করুন!</p>`;
                return;
            }

            let filtered = cachedPosts;

            // Main Category Filter
            if (currentTab === 'archive') {
                filtered = cachedPosts.filter(p => p.media_url || (p.author_name && p.author_name.includes('[আর্কাইভ]')));
            } else if (currentTab === 'islamic') {
                filtered = cachedPosts.filter(p => p.author_name && p.author_name.includes('[ইসলামিক]'));
            }

            // Media View Filter
            if (mediaView === 'photos') {
                filtered = filtered.filter(p => p.media_url && !isVideo(p.media_url));
            } else if (mediaView === 'videos') {
                filtered = filtered.filter(p => p.media_url && isVideo(p.media_url));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-500 py-6">এই ভিউতে কোনো ফাইল বা পোস্ট পাওয়া যায়নি।</p>`;
                return;
            }

            // Grid Layout for Photo Gallery Mode
            if (mediaView === 'photos') {
                let gridHtml = `<div class="grid grid-cols-2 gap-3">`;
                filtered.forEach(post => {
                    gridHtml += `
                        <div class="bg-white dark:bg-gray-800 p-2 rounded-xl shadow-sm space-y-1">
                            <img src="${post.media_url}" onclick="openModal('${post.media_url}')" class="rounded-lg w-full h-36 object-cover cursor-pointer hover:opacity-90">
                            <p class="text-[10px] text-gray-400 truncate">${post.author_name}</p>
                        </div>
                    `;
                });
                gridHtml += `</div>`;
                container.innerHTML = gridHtml;
                return;
            }

            // Feed & Video Gallery Display
            filtered.forEach(post => {
                const hasVideo = isVideo(post.media_url);

                container.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-emerald-800 text-white flex items-center justify-center font-bold text-xs">${post.author_name ? post.author_name[0].toUpperCase() : 'U'}</div>
                                <div>
                                    <h4 class="font-bold text-xs dark:text-gray-200">${post.author_name || 'পারিবারিক সদস্য'}</h4>
                                    <p class="text-[10px] text-gray-400">${new Date(post.created_at).toLocaleString('bn-BD')}</p>
                                </div>
                            </div>
                        </div>
                        <p class="text-sm dark:text-gray-300">${post.content}</p>
                        ${post.media_url ? (
                            hasVideo 
                            ? `<video src="${post.media_url}" controls playsinline class="rounded-lg w-full max-h-80 bg-black"></video>` 
                            : `<img src="${post.media_url}" onclick="openModal('${post.media_url}')" class="rounded-lg w-full max-h-80 object-cover cursor-pointer" onerror="this.style.display='none'">`
                        ) : ''}
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'text-yellow-400');
                btn.classList.add('text-gray-400');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.add('active', 'text-yellow-400');
                activeBtn.classList.remove('text-gray-400');
            }

            const title = document.getElementById('tab-title');
            const subtitle = document.getElementById('tab-subtitle');

            if (tab === 'feed') {
                title.innerText = "পারিবারিক আর্কাইভ";
                subtitle.innerText = '"ঈমান, একতা ও ঐতিহ্যের বন্ধন"';
            } else if (tab === 'archive') {
                title.innerText = "স্মৃতি ও মিডিয়া আর্কাইভ";
                subtitle.innerText = '"পরিবারের গুরুত্বপূর্ণ ছবি ও স্মৃতিসমূহ"';
            } else if (tab === 'islamic') {
                title.innerText = "ইসলামিক কর্নার";
                subtitle.innerText = '"দৈনন্দিন দোয়া, হাদিস ও ধর্মীয় উপদেশ"';
            }

            renderPosts();
        }

        window.addEventListener('DOMContentLoaded', fetchPosts);
    </script>
</body>
</html>
